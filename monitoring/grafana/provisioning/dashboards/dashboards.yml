apiVersion: 1

# allowUiUpdates is off on purpose: dashboards are edited in git and shipped
# by the deploy job, so a container replacement never loses work.
providers:
  - name: matcha
    orgId: 1
    folder: ""
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
