        <text x="920" y="226" font-size="10" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">external</text>
      </g><g class="ak-node" data-node-id="sqlite" data-label="SQLite / Postgres" data-role="database" data-desc="Accounts, message history, favourites, notes, summaries" tabindex="0">
