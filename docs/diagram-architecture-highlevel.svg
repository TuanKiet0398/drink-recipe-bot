<svg class="ak-diagram-svg" viewBox="0 0 1400 432" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Matcha Bot — High-Level Architecture"><title>Matcha Bot — High-Level Architecture</title><defs><style>
