        <text x="140" y="226" font-size="10" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">external</text>
      </g><g class="ak-node" data-node-id="admin-spa" data-label="Admin/Web SPA" data-role="frontend" data-desc="React admin dashboard; also hosts each account&apos;s own web chat" tabindex="0">
