<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matcha Bot — system architecture — system design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f8fafc; --surface:#f8fafc;
  --grid:color-mix(in srgb, #475569 10%, transparent);
  --ink:#1e293b; --muted:#475569; --stroke:#475569; --stroke-w:1.5px; --radius:8px;
  --font-title:"Inter",ui-sans-serif,system-ui,sans-serif;
  --font-label:"Inter",ui-sans-serif,system-ui,sans-serif;
  --fs-title:1.375rem; --fs-label:16px; --fs-sub:13px;
  --role-client:#dbeafe;  --ink-client:#2563eb;  --accent-client:#3b82f6;  --on-client:#1e40af;
  --role-service:#ffedd5; --ink-service:#ea580c; --accent-service:#f97316; --on-service:#9a3412;
  --role-data:#dcfce7;    --ink-data:#16a34a;    --accent-data:#22c55e;    --on-data:#166534;
  --role-async:#f3e8ff;   --ink-async:#9333ea;   --accent-async:#a855f7;   --on-async:#6b21a8;
  --role-external:#f3f4f6;--ink-external:#4b5563;--accent-external:#6b7280;--on-external:#1f2937;
  --role-error:#fee2e2;   --ink-error:#dc2626;   --accent-error:#ef4444;   --on-error:#991b1b;
  --role-infra:#f1f5f9;   --ink-infra:#475569;   --accent-infra:#14b8a6;   --on-infra:#1e293b;
  --dur-flow:1200ms; --dur-pulse:1600ms; --dur-fill:2000ms; --dur-cam:27300ms;
  --ease-flow:ease-in-out; --ease-cam:cubic-bezier(.83,0,.17,1);
  --dash:8; --dash-gap:6; --dash-cycle:56; --empty:.22; --glow:8px;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-label)}
.diagram{max-width:1440px;margin:0 auto;padding:24px 16px 40px}
.diagram__title{font:600 var(--fs-title)/1.2 var(--font-title);margin:0 0 4px;letter-spacing:-.01em}
.diagram__subtitle{margin:0 0 18px;color:var(--muted);font-size:.875rem}
.diagram__canvas{display:block;width:100%;height:auto;background:var(--surface);
  background-image:radial-gradient(var(--grid) 1px,transparent 1px);background-size:20px 20px;border-radius:var(--radius);overflow:hidden}
[data-role="client"]  {--fill:var(--role-client);  --line:var(--ink-client);  --accent:var(--accent-client);  --on:var(--on-client)}
[data-role="service"] {--fill:var(--role-service); --line:var(--ink-service); --accent:var(--accent-service); --on:var(--on-service)}
[data-role="data"]    {--fill:var(--role-data);    --line:var(--ink-data);    --accent:var(--accent-data);    --on:var(--on-data)}
[data-role="async"]   {--fill:var(--role-async);   --line:var(--ink-async);   --accent:var(--accent-async);   --on:var(--on-async)}
[data-role="external"]{--fill:var(--role-external);--line:var(--ink-external);--accent:var(--accent-external);--on:var(--on-external)}
[data-role="error"]   {--fill:var(--role-error);   --line:var(--ink-error);   --accent:var(--accent-error);   --on:var(--on-error)}
[data-role="infra"]   {--fill:var(--role-infra);   --line:var(--ink-infra);   --accent:var(--accent-infra);   --on:var(--on-infra)}
.node__shape{fill:var(--fill);stroke:var(--line);stroke-width:var(--stroke-w)}
.node--primary .node__shape{stroke-width:calc(var(--stroke-w) * 1.4)}
.node__detail{fill:none;stroke:var(--line);stroke-width:1;opacity:.65}
.node__icon{fill:var(--line)}
.node__label{fill:var(--on);font:600 var(--fs-label) var(--font-label);text-anchor:middle}
.node__sub{fill:var(--on);font:400 var(--fs-sub) var(--font-label);text-anchor:middle;opacity:.85;font-variant-ligatures:none}
.queue__track{fill:var(--on);opacity:.16;stroke:none}
.queue__fill{fill:var(--accent);stroke:none}
.edge{fill:none;stroke:var(--stroke);stroke-width:var(--stroke-w);stroke-linecap:round;stroke-linejoin:miter;marker-end:url(#arrow)}
.edge--primary{stroke-width:calc(var(--stroke-w) * 1.35)}
.edge--async{stroke:var(--ink-async);stroke-dasharray:10 7;marker-end:url(#arrow-open)}
.edge__label{fill:var(--muted);font:500 var(--fs-sub) var(--font-label);text-anchor:middle}
.marker{fill:var(--stroke);stroke:none}
.marker--open{fill:none;stroke:var(--ink-async);stroke-width:1.6}
.anim-dash-flow{stroke-dasharray:var(--dash) var(--dash-gap);animation:dash-flow var(--dur-flow) linear infinite}
@keyframes dash-flow{to{stroke-dashoffset:-42}}
.packet{offset-distance:0%;offset-rotate:0deg}
.anim-packet-travel{animation:pkt var(--dur-flow) var(--ease-flow) infinite}
@keyframes pkt{0%{offset-distance:0%;opacity:0}8%{opacity:1}70%{offset-distance:100%;opacity:1}80%,100%{offset-distance:100%;opacity:0}}
.anim-queue-fill{transform-box:fill-box;transform-origin:left center;animation:queue-fill var(--dur-fill) ease-out infinite alternate}
@keyframes queue-fill{from{transform:scaleX(.6)}to{transform:scaleX(calc(1 - var(--empty)))}}
.anim-pulse-glow{animation:pulse-glow var(--dur-pulse) ease-in-out infinite}
@keyframes pulse-glow{0%,100%{opacity:1}50%{opacity:.72}}
.legend{list-style:none;display:flex;flex-wrap:wrap;gap:10px 22px;margin:18px 0 0;padding:0}
.legend__item{display:flex;align-items:center;gap:8px;font-size:.8125rem;color:var(--muted)}
.legend__swatch{inline-size:16px;block-size:16px;border-radius:4px;background:var(--fill);border:2px solid var(--line)}
.act-zone rect{fill:none;stroke:var(--muted);stroke-width:1;stroke-dasharray:4 4;opacity:.5}
.act-label{fill:var(--muted);font:600 .75rem var(--font-label);letter-spacing:.04em;text-transform:uppercase}
.camera{transform-origin:0 0;will-change:transform;animation:cam-tour var(--dur-cam) var(--ease-cam) infinite}
@keyframes cam-tour{
  0%, 7.33% {transform:none}
  10.07%, 21.79% {transform:translate(342.4px,-355.2px) scale(2.360)}
  24.54%, 31.87% {transform:none}
  35.16%, 44.32% {transform:translate(-1100.6px,-881.1px) scale(3.371)}
  47.62%, 54.95% {transform:none}
  57.51%, 71.79% {transform:translate(-950.2px,-507.7px) scale(1.815)}
  74.36%, 81.68% {transform:none}
  84.98%, 96.7% {transform:translate(-2348.0px,-921.6px) scale(2.360)}
  100%, 100% {transform:none}
}
@keyframes act-focus-1-rect{
  0%, 7.33%    {stroke:var(--muted); stroke-width:1; stroke-dasharray:4 4; opacity:.5}
  10.07%,21.79% {stroke:var(--ink); stroke-width:2; stroke-dasharray:0 0; opacity:1}
  24.54%, 100%  {stroke:var(--muted); stroke-width:1; stroke-dasharray:4 4; opacity:.5}
}
@keyframes act-focus-1-label{
  0%, 7.33%    {fill:var(--muted)}
  10.07%,21.79% {fill:var(--ink)}
  24.54%, 100%  {fill:var(--muted)}
}
@keyframes act-focus-2-rect{
  0%, 31.87%    {stroke:var(--muted); stroke-width:1; stroke-dasharray:4 4; opacity:.5}
  35.16%,44.32% {stroke:var(--ink); stroke-width:2; stroke-dasharray:0 0; opacity:1}
  47.62%, 100%  {stroke:var(--muted); stroke-width:1; stroke-dasharray:4 4; opacity:.5}
}
@keyframes act-focus-2-label{
  0%, 31.87%    {fill:var(--muted)}
  35.16%,44.32% {fill:var(--ink)}
  47.62%, 100%  {fill:var(--muted)}
}
@keyframes act-focus-3-rect{
  0%, 54.95%    {stroke:var(--muted); stroke-width:1; stroke-dasharray:4 4; opacity:.5}
  57.51%,71.79% {stroke:var(--ink); stroke-width:2; stroke-dasharray:0 0; opacity:1}
  74.36%, 100%  {stroke:var(--muted); stroke-width:1; stroke-dasharray:4 4; opacity:.5}
}
@keyframes act-focus-3-label{
  0%, 54.95%    {fill:var(--muted)}
  57.51%,71.79% {fill:var(--ink)}
  74.36%, 100%  {fill:var(--muted)}
}
@keyframes act-focus-4-rect{
  0%, 81.68%    {stroke:var(--muted); stroke-width:1; stroke-dasharray:4 4; opacity:.5}
  84.98%,96.7% {stroke:var(--ink); stroke-width:2; stroke-dasharray:0 0; opacity:1}
  100%, 100%  {stroke:var(--muted); stroke-width:1; stroke-dasharray:4 4; opacity:.5}
}
@keyframes act-focus-4-label{
  0%, 81.68%    {fill:var(--muted)}
  84.98%,96.7% {fill:var(--ink)}
  100%, 100%  {fill:var(--muted)}
}
.act-zone[data-act="1"] rect{animation:act-focus-1-rect var(--dur-cam) var(--ease-cam) infinite}
.act-zone[data-act="1"] .act-label{animation:act-focus-1-label var(--dur-cam) var(--ease-cam) infinite}
.act-zone[data-act="2"] rect{animation:act-focus-2-rect var(--dur-cam) var(--ease-cam) infinite}
.act-zone[data-act="2"] .act-label{animation:act-focus-2-label var(--dur-cam) var(--ease-cam) infinite}
.act-zone[data-act="3"] rect{animation:act-focus-3-rect var(--dur-cam) var(--ease-cam) infinite}
.act-zone[data-act="3"] .act-label{animation:act-focus-3-label var(--dur-cam) var(--ease-cam) infinite}
.act-zone[data-act="4"] rect{animation:act-focus-4-rect var(--dur-cam) var(--ease-cam) infinite}
.act-zone[data-act="4"] .act-label{animation:act-focus-4-label var(--dur-cam) var(--ease-cam) infinite}
@media (prefers-reduced-motion: reduce){
  .anim-dash-flow{animation:none !important;stroke-dasharray:none !important}
  .edge--async{stroke-dasharray:10 7 !important}
  .anim-packet-travel{animation:none !important;offset-distance:100% !important;opacity:1 !important}
  .anim-queue-fill{animation:none !important;transform:scaleX(calc(1 - var(--empty))) !important}
  .anim-pulse-glow{animation:none !important;opacity:1 !important}
  .camera{animation:none !important;transform:none !important}
  .act-zone rect{animation:none !important}
  .act-label{animation:none !important}
}
</style>
</head>
<body>
<main class="diagram">
  <h1 class="diagram__title">Matcha Bot — system architecture</h1>
  <p class="diagram__subtitle">flat-minimal · camera-acts · ACT 1 clients → ACT 2 backend/gateway → ACT 3 AI &amp; data → ACT 4 observability</p>
  <svg class="diagram__canvas" viewBox="0 0 1440 800" role="img" aria-labelledby="t d">
    <title id="t">Matcha Bot system architecture</title>
    <desc id="d">ACT 1: a Telegram user and a web admin reach the bot through Telegram's Bot API and the admin browser.
      ACT 2: a per-channel long-poll (channel_manager.py/telegram_poller.py) and the FastAPI backend receive and route messages.
      ACT 3: a LangGraph agent (fetch_history to retrieve to generate to check_facts) is the live processor, calling a Chroma vector
      database with hybrid BM25 search, the OpenAI API for query rewriting/reranking/generation/grounding, and a SQL database for
      history and memory. ACT 4: Prometheus scrapes the backend and host/container metrics, and Grafana renders dashboards from
      Prometheus. The camera opens on the whole system, then tours each act in flow order and back to overview.</desc>

      <marker id="arrow-open" class="marker marker--open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M 0 0 L 10 5 L 0 10" fill="none"/></marker>
