[project]
name = "matcha-bot-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "openai>=1.50",
    "chromadb>=0.5",
    "langgraph>=0.2",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "cryptography>=42",
    "prometheus-client>=0.21",
    "prometheus-fastapi-instrumentator>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-mock>=3.14",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is the framework's idiom

[tool.ruff.lint.per-file-ignores]
# These modules embed LLM prompt text as literals. Wrapping those lines
# would change the prompt the model actually receives.
"app/agent/nodes.py" = ["E501"]
"app/ingestion.py" = ["E501"]
