server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxied so an external health check actually reaches the backend.
    # Without this, /health falls through to try_files and returns the SPA
    # shell with a 200, making the deploy gate meaningless.
    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Account registration (no admin auth).
    location /auth/ {
        proxy_pass http://backend:8000/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri /index.html;
    }
}
